<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SQL Challengers - Learn SQL through retro arcade gameplay!">
    <title>SQL Challengers - WrongYou Games</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    
    <!-- Game Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <!-- Firebase Config (for future features) -->
    <script type="module" src="../../shared/js/firebase-config.js"></script>
    
    <!-- Game Configuration -->
    <script type="module" src="js/config.js"></script>
    
    <!-- Game Scenes -->
    <script type="module" src="js/scenes/BootScene.js"></script>
    <script type="module" src="js/scenes/PreloadScene.js"></script>
    <script type="module" src="js/scenes/MenuScene.js"></script>
    <script type="module" src="js/scenes/GameScene.js"></script>
    <script type="module" src="js/scenes/GameOverScene.js"></script>
    
    <!-- Game Entities -->
    <script type="module" src="js/entities/Player.js"></script>
    <script type="module" src="js/entities/Enemy.js"></script>
    <script type="module" src="js/entities/DataItem.js"></script>
    
    <!-- Game Systems -->
    <script type="module" src="js/systems/SQLEngine.js"></script>
    <script type="module" src="js/systems/ScoreManager.js"></script>
    
    <!-- Main Game Entry -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
